name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the three municipal datasets once a day; GitHub may delay runs.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh municipal data
        id: city
        continue-on-error: true
        run: npm run data:refresh
      - name: Explain fallback data
        if: steps.city.outcome == 'failure'
        run: echo "::warning::Some municipal sources were unavailable. The affected datasets keep their repository copies and original dates."
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build for the configured Pages address
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run pages:build -- --base="${PAGES_BASE_PATH}/"
      - name: Check published files and routing worker
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run pages:check -- --base="${PAGES_BASE_PATH}/"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
