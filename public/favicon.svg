<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="uaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0057B7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="uaYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="50" y="20" width="400" height="400" rx="90" fill="url(#bgGrad)" filter="url(#shadow)" />

  <circle cx="250" cy="220" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="40" />

  <path d="M 130 330 C 130 240, 230 280, 230 210 C 230 150, 310 170, 310 110" 
        fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="42" stroke-linecap="round" />

  <path d="M 130 330 C 130 240, 230 280, 230 210 C 230 150, 310 170, 310 110" 
        fill="none" stroke="url(#pathGrad)" stroke-width="34" stroke-linecap="round" />

  <path d="M 130 330 C 130 240, 230 280, 230 210 C 230 150, 310 170, 310 110" 
        fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" opacity="0.75" />

  <g transform="translate(130, 330)" filter="url(#subtleShadow)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="19" fill="#2563EB" />
    <circle cx="0" cy="-6" r="2.5" fill="#FFFFFF" />
    <path d="M -1 -1 L 3 -1 L 5 5 L -1 5 M -3 4 A 5 5 0 1 0 2 9" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <circle cx="310" cy="110" r="14" fill="#FFFFFF" filter="url(#subtleShadow)" />
  <circle cx="310" cy="110" r="7" fill="#2563EB" />

  <path d="M 310 110 L 310 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#subtleShadow)" />
  <circle cx="310" cy="38" r="4" fill="#FFD700" />

  <path d="M 312 42 C 335 36, 355 48, 380 42 L 380 64 C 355 70, 335 58, 312 64 Z" fill="url(#uaBlue)" filter="url(#subtleShadow)" />
  <path d="M 312 64 C 335 58, 355 70, 380 64 L 380 86 C 355 92, 335 80, 312 86 Z" fill="url(#uaYellow)" filter="url(#subtleShadow)" />

  
</svg>
